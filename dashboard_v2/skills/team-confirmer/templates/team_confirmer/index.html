{%- extends "base.html" -%}
{%- block title -%}Team Confirmer · CoS v2{%- endblock -%}
{%- block content -%}
<div class="stage-page">
  <div class="stage-page-header">
    <div class="stage-page-title">
      <h1>Team Confirmer</h1>
      <span class="stage-window-label">System Updates · Task #8</span>
    </div>
  </div>
  <p style="color:var(--text-soft);margin:0 0 24px;font-size:14px;">Generate confirmation emails to each placement contact and client service colleague for this renewal.</p>

  <div class="skill-shell">
    <div class="skill-form-panel">
      <div class="skill-field">
        <label class="skill-label">Client</label>
        <select id="client_name" class="stage-override-select" style="width:100%;padding:10px;">
          <option value="">— Select client —</option>
          {% for c in clients %}<option>{{ c }}</option>{% endfor %}
        </select>
      </div>
      <button class="skill-run-btn" onclick="runConfirm()">Generate Confirmations</button>
    </div>
    <div class="skill-result-panel" id="result" style="display:none;">
      <div id="confirm_emails"></div>
    </div>
  </div>
</div>
<script>
function copyText(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value || el.innerText);
  showMiniToast('Copied');
}
</script>
{%- endblock -%}
